[project]
name = "proofline"
version = "0.1.0"
description = "A page-grounded fact knowledge layer for financial PDFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128.0",
  "openai>=2.8.0",
  "pydantic>=2.10.0",
  "pymupdf>=1.26.0",
  "python-multipart>=0.0.20",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.36.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[project.scripts]
proofline = "proofline.cli:main"
proofline-serve = "proofline.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proofline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
