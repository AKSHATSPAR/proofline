services:
  - type: web
    name: proofline
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn proofline.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PROOFLINE_DB_PATH
        value: /tmp/proofline.db
      - key: PROOFLINE_DEMO_ONLY
        value: "1"
